name: Aggiornamento Automatico con AI
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Accedi ai file
      uses: actions/checkout@v4
    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Installa pacchetti
      run: pip install feedparser requests
    - name: Esegui Scrittura AI
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python aggrega.py
    - name: Pubblica sul sito
      run: |
        git config --global user.name "Robot Scrittore"
        git config --global user.email "bot@giornale.com"
        git add .
        git commit -m "Bozze AI generate" || exit 0
        git push
